version: "3.8"

services:

  redis:
    image: redis:7
    container_name: redis_container
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_container
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build: .
    container_name: springboot_app
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - rabbitmq