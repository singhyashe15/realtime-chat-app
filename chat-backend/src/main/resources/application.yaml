spring:
  application:
    name: Chat-Backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASS}
    driver-class-name: ${DATABASE_DRIVER}

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: ${DIALECT}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}

SECURITY_KEY: ${SECURITY_KEY}
FRONTEND_URL: ${FRONTEND_URL}

logging:
  level:
    org:
      springframework:
        messaging: DEBUG
        web:
          socket: DEBUG

brevo:
  api-key: ${MAIL_API_KEY}
  sender:
    name: ${SENDER_NAME}
    email: ${EMAIL}