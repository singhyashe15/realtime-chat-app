spring:
  application:
    name: Chat-Backend

  datasource:
    url: DATABASE_URL
    username: DATABASE_PASSWORD
    password: DATABASE_PASS
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  redis:
    host: redis
    port: 6379

SECURITY_KEY: SECURITY_KEY
FRONTEND_URL: FRONTEND_URL

logging:
  level:
    org:
      springframework:
        messaging: DEBUG
        web:
          socket: DEBUG

brevo:
  api-key: MAIL_API_KEY
  sender:
    name: SENDER_NAME
    email: EMAIL